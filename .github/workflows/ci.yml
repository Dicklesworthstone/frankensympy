name: CI Gate Topology

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'head' }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_BUILD_JOBS: 1
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  RUSTFLAGS: "-D warnings"
  RUST_TOOLCHAIN: nightly-2026-08-20

jobs:
  # ── G0: Planning Integrity ─────────────────────────────────────────
  g0-planning-integrity:
    name: "G0: planning integrity"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python tools/validate_planning.py
      - run: python tools/validate_planning.py --self-test
      - run: python -m unittest discover -s tools -p 'test_*.py'
      - run: python -m unittest discover -s tools/conformance-lab -p 'test_*.py'

  # ── G1: Formatting + Linting ──────────────────────────────────────
  g1-fmt-lint:
    name: "G1: fmt + clippy"
    needs: g0-planning-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch registry-pinned workspace dependencies
        run: python3 scripts/fetch_workspace_donors.py
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo check --workspace --all-targets
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # ── G2: Unit Tests ────────────────────────────────────────────────
  g2-unit-tests:
    name: "G2: unit tests"
    needs: g1-fmt-lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Prepare the pinned differential-test oracle
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import venv

          directory = Path(os.environ["RUNNER_TEMP"]) / "fsym-oracle-sympy-1.14.0"
          if directory.exists():
              raise SystemExit(f"Refusing to replace an existing oracle environment: {directory}")
          venv.EnvBuilder(with_pip=True).create(directory)
          interpreter = directory / "bin" / "python"
          subprocess.run([
              str(interpreter), "-m", "pip", "install",
              "--disable-pip-version-check", "sympy==1.14.0", "mpmath==1.3.0",
          ], check=True)
          subprocess.run([
              str(interpreter), "-I", "-c",
              "import sympy; assert sympy.__version__ == '1.14.0'; "
              "print('Differential oracle:', sympy.__version__, sympy.__file__)",
          ], check=True)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as environment:
              environment.write(f"FSYM_ORACLE_PYTHON={interpreter}\n")
          PY
      - name: Fetch registry-pinned workspace dependencies
        run: python3 scripts/fetch_workspace_donors.py
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo test --workspace -- --nocapture

  # ── G3: Actual native extension and public feature regressions ─────
  g3-public-features:
    name: "G3: native public feature regressions"
    needs: g0-planning-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch registry-pinned workspace dependencies
        run: python scripts/fetch_workspace_donors.py
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: python -m pip install --disable-pip-version-check pytest==8.4.2
      - name: Native feature regressions
        run: |
          cargo test --locked -p fsym-bigint --lib floor_square_root_pins_exact_square_boundaries_and_governed_lane -j1
          cargo test --locked -p fsym-polys --test rational_localization -j1
          cargo test --locked -p fsym-calculus --test rational_laplace -j1
          cargo test --locked -p fsym-proof-kernel --test elementary_rational_definite -j1
          cargo test --locked -p fsym-calculus --test elementary_rational_definite --test rational_definite --test definite_integration_domains -j1
          cargo test --locked -p fsym-solvers --lib --test algebraic_components --test polynomial_system --test polynomial_components --test rational_components --test rational_graph --test rational_systems -j1
      - name: Build the full Python extension
        run: cargo build --locked -p fsym-python --features extension-module -j1
      - name: Test the checked-out shell against the current native extension
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import importlib.util
          import json
          import os
          import subprocess
          import sys

          root = Path.cwd().resolve()
          target = Path(os.environ.get("CARGO_TARGET_DIR", "target"))
          if not target.is_absolute():
              target = root / target
          binary = (target / "debug/libfsym_python.so").resolve()
          assert binary.is_file(), binary
          spec = importlib.util.spec_from_file_location("fsym_python", binary)
          assert spec is not None and spec.loader is not None
          native = importlib.util.module_from_spec(spec)
          sys.modules["fsym_python"] = native
          spec.loader.exec_module(native)
          assert Path(native.__file__).resolve() == binary
          sys.path.insert(0, str(root / "python"))
          import sympy
          from sympy.core import _native
          assert Path(sympy.__file__).resolve() == root / "python/sympy/__init__.py"
          assert _native is native
          assert hasattr(native, "polynomial_system_solutions_native")
          assert hasattr(native, "inverse_rational_laplace_native")
          assert hasattr(native, "polynomial_laplace_native")
          import pytest
          with binary.open("rb") as stream:
              digest = hashlib.file_digest(stream, "sha256").hexdigest()
          print(json.dumps({
              "commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "native": str(binary), "native_sha256": digest,
              "shell": sympy.__file__, "python": sys.version, "pytest": pytest.__version__,
          }), flush=True)
          raise SystemExit(pytest.main([
              "-q", "-p", "no:cacheprovider",
              "python/tests/test_polynomial_system_checked.py",
              "python/tests/test_polynomial_system_extensions.py",
              "python/tests/test_polynomial_rur.py",
              "python/tests/test_polynomial_components.py",
              "python/tests/test_rational_polynomial_families.py",
              "python/tests/test_rational_components.py",
              "python/tests/test_algebraic_components.py",
              "python/tests/test_rational_system_sources.py",
              "python/tests/test_rational_laplace.py",
              "python/tests/test_polynomial_laplace.py",
              "python/tests/test_rational_definite.py",
              "python/tests/test_surface.py::SurfaceTests::test_extended_solvers_transforms_functions_and_submodules",
              "python/tests/test_surface.py::SurfaceTests::test_piecewise_power_integrals_and_laplace",
              "python/tests/test_surface.py::SurfaceTests::test_integral_transforms_suite",
          ]))
          PY
