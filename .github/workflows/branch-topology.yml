name: Verify Remote Main (Read Only)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: branch-topology
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-main:
    name: "Verify main without changing remote branches"
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify branch-policy regression tests
        run: python3 -m unittest discover -s tools -p 'test_remote_main.py'

      - name: Observe current remote main
        env:
          EXPECTED_MAIN_SHA: ${{ github.sha }}
        run: python3 tools/verify_remote_main.py --expected "$EXPECTED_MAIN_SHA"
