[package]
name = "fsym-durable"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true
publish = false
description = "Storage-neutral durable checkpoint boundary with a canonical file reference lane and an optional pinned FrankenSQLite adapter (L5). Home of the fresh-process factor-frontier crash matrix."

[features]
default = ["factor-worker"]
# The storage library itself has no mathematical or async runtime dependency.
# Preserve the existing worker/default test suite while allowing its ordinary
# file/record boundary to be used and tested independently.
factor-worker = [
    "dep:fsym-runtime", "dep:fsym-core", "dep:fsym-polys",
    "dep:fsym-proof-kernel", "dep:fsym-assumptions", "dep:fsym-budget",
    "dep:asupersync",
]

[[bin]]
name = "factor_frontier_worker"
path = "src/bin/factor_frontier_worker.rs"
required-features = ["factor-worker"]

[[test]]
name = "fresh_process_crash_matrix"
path = "tests/fresh_process_crash_matrix.rs"
required-features = ["factor-worker"]

[dependencies]
fsym-runtime = { workspace = true, optional = true }
fsym-core = { workspace = true, optional = true }
fsym-polys = { workspace = true, optional = true }
fsym-proof-kernel = { workspace = true, optional = true }
fsym-assumptions = { workspace = true, optional = true }
fsym-budget = { workspace = true, optional = true }
asupersync = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
blake3 = "1"

# The optional FrankenSQLite adapter (registries/dependencies.toml:
# frankensqlite @ abdc4dc89714e8816202fd0bf2e9cd969f6d493f) is deferred:
# the pinned commit resolves asupersync 0.5.0 from the registry, and a
# second asupersync build unit requires a written admission review
# (constitution §7.7/§9). The canonical file reference lane always builds.
