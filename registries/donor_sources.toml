[disposition]
adopt = "reuse a mechanism or narrowly reviewed implementation with unchanged trust semantics"
selective_adopt = "reuse only named crates or algorithms after dependency and conformance review"
adapt = "reuse the architectural idea after changing boundaries, identities, or authority"
research = "optional experiment with registered corpus, baseline, and stop rule"
reject = "explicitly prohibited shortcut or unsuitable inheritance"

[requirements]
exact_commit_pin = true
source_surface_inventory = true
trust_boundary_review = true
dependency_review_before_code_reuse = true
no_automatic_admission_for_same_owner = true
review_freshness_required_for_release = true
