[[allowed_source]]
id = "lean_core_external"
class = "optional_offline_external_checker"
repository = "leanprover/lean4"
commit = "f3b06c705e6c85f5314019d5d3baab0fec5b580c"
version = "4.32.2"
status = "planned_pending_independent_review"
portable_verifier_allowed = false
purpose = "Optional independent foreign check of lean_core_zz_product_v1; not a native mathematics engine"
alternatives = "Native verification remains sufficient; existing franken_lean admission has a distinct pin and does not establish an executable pipeline for this upstream Lean-core profile"
owning_crates = ["fsym-formal"]
layer = "L6"
features = "Standalone Lean core only; no mathlib, plugins, --run, Cargo dependency or default runtime feature"
transitive_lock_digest = "Installed executable and complete lib tree manifest SHA256 88d1bfed5e2ba13e7dd28043c70a303f1ea1b301220023fe6b9a1a5d14368f9f; generated by tools/check_formal_projection.py:environment"
transitive_count = "Recorded as manifest file rows, not a Cargo package count; host runtime outside installed lib tree requires separate review"
build_scripts = "None added; no checker download, upstream build, or network access in repository build scripts or gate"
proc_macros = "No Lean proc macros admitted; existing Rust adapter scaffold dependencies retain their own review obligations"
unsafe = "Upstream Lean runtime contains native C/C++ and dependency-authored unsafe behavior; no project-authored unsafe exemption and no process-memory-safety claim"
ffi = "External process only; no native FFI, linking or portable verifier closure inclusion"
effects = "Explicit executable and local artifact filesystem/process access; offline, no runtime code loader; bounded subprocess output and wall clock"
determinism = "Exact release banner, source pin and installed closure hash; fixed source grammar, empty LEAN_PATH, one checker thread; host telemetry excluded from semantic roots"
serialization = "Canonical native mapping and immutable receipt; fixed Lean source; capsule <=16384 bytes, source <=32768 bytes, JSON <=131072 bytes"
wasm_no_std = "Optional x86_64 Linux host checker only; not a Wasm or no_std dependency; native portability unchanged"
license = "Upstream Apache-2.0, verified from installed v4.32.2 LICENSE; bundled libraries have additional LICENSES notices and require separate distribution review"
maintenance = "Pinned upstream release only; upgrades require a new immutable profile and environment review"
advisories = "Independent advisory review pending; no clean-scan claim"
containment = "L6 outward adapter to L2 proof kernel; native verification first, independent mapping check, no external boolean authority; 60-second Lean subprocess limit"
exit_plan = "Omit fsym-formal and the external checker; native verification, evidence and mathematical identity remain unchanged"
reviewer = "Independent reviewer pending"
freshness = "2026-09-17 pin/license record; independent admission and conformance review pending"
gate = "tools/check_formal_projection.py with explicit --lean, --projector, fresh --artifacts and --expected-environment; normative details in docs/FORMAL_PROOF_INTEROPERABILITY.md"

[[fundamental_category]]
id = "serialization_scaffold"
examples = ["serde"]
default_features = "off_until_reviewed"
algorithmic_use = false
admission_required = true

[[fundamental_category]]
id = "cryptographic_hash"
examples = []
default_features = "off_until_reviewed"
algorithmic_use = false
admission_required = true

[[fundamental_category]]
id = "safe_cpython_binding"
examples = []
default_features = "off_until_reviewed"
algorithmic_use = false
admission_required = true
portable_verifier_allowed = false

[[forbidden_family]]
id = "native_math_backends"
patterns = ["gmp", "flint", "arb", "singular", "blas", "lapack", "openblas", "mkl", "cuda"]
reason = "pure Rust mathematical engine"

[[forbidden_family]]
id = "alternate_async_runtimes"
patterns = ["tokio", "async-std", "smol"]
reason = "asupersync is the sole runtime substrate"

[[forbidden_family]]
id = "unreviewed_algorithm_crates"
patterns = ["generic CAS, graph, solver, storage, or numerical implementation"]
reason = "algorithmic functionality must be owned or selectively admitted from FrankenSuite"

[required_review_fields]
purpose = true
alternatives = true
features = true
transitive_lock_digest = true
build_scripts = true
proc_macros = true
unsafe = true
ffi = true
effects = true
determinism = true
serialization = true
wasm_no_std = true
license = true
advisories = true
containment = true
exit_plan = true
reviewer = true
freshness = true
