ng candidate grants no evidence. The local nonsingular-root claim is accepted only by native original-source domain, strict-inclusion and contraction checks. Thirty-six new public cases pass with forged-candidate, precision/width retry, assumption-mutation, singular/no-root and resource adversaries. Ordinary nsolve remains approximate. The source-scoped combined run passes 214 Python cases with one explicit pre-existing runtime-only exclusion; the complete campaign and profile gates remain open."

