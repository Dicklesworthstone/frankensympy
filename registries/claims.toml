schema_version = 1
registry_status = "planning"

[status_semantics]
documented = "The referenced planning/documentation artifact exists; no runtime capability is implied."
planned = "Target architecture or capability with no implementation claim."
implemented_uncertified = "Reachable implementation exists, but required claim gates are incomplete."
validated = "Scoped technical gates pass, but full release/profile certification is not claimed."
certified = "All immutable claim/profile release gates pass on the same commit."
blocked = "A known issue prevents the claim."
retired = "Claim ID is preserved but no longer pursued or advertised."

[policy]
unknown_claim_fails_closed = true
present_tense_capability_requires_non_planned_status = true
implemented_status_requires_artifact = true
validated_status_requires_gate_bundle = true
certified_status_requires_same_commit_gate_bundle = true
performance_claim_requires_live_incumbent = true
performance_claim_requires_semantic_admission = true
mathematical_claim_requires_typed_claim_and_verifier = true
compatibility_claim_requires_immutable_profile = true
repair_claim_requires_decode_digest_schema_and_semantic_checks = true
monitoring_claim_cannot_grant_mathematical_evidence = true
retired_claim_ids_must_remain = true

