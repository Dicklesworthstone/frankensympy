[package]
name = "frankensympy-session-source-component-check"
version = "0.1.0"
edition = "2024"
publish = false
autotests = false
autobins = false

[workspace]
members = ["runtime", "codec"]
default-members = ["."]
resolver = "3"

[lib]
name = "frankensympy"
path = "/workspace/scratch/be76fc747855/frankensympy/src/lib.rs"

[[bin]]
name = "frankensympy"
path = "/workspace/scratch/be76fc747855/frankensympy/src/bin/frankensympy.rs"





[dependencies]
fsym-numeric-consumer = { path = "/workspace/scratch/be76fc747855/frankensympy/crates/fsym-numeric-consumer" }
fsym-assumptions = { path = "/workspace/scratch/be76fc747855/frankensympy/crates/fsym-assumptions" }
fsym-budget = { path = "/workspace/scratch/be76fc747855/frankensympy/crates/fsym-budget" }
fsym-calculus = { path = "/workspace/scratch/be76fc747855/frankensympy/crates/fsym-calculus" }
fsym-core = { path = "/workspace/scratch/be76fc747855/frankensympy/crates/fsym-core" }
fsym-polys = { path = "/workspace/scratch/be76fc747855/frankensympy/crates/fsym-polys" }
fsym-proof-kernel = { path = "/workspace/scratch/be76fc747855/frankensympy/crates/fsym-proof-kernel" }
fsym-simplify = { path = "/workspace/scratch/be76fc747855/frankensympy/crates/fsym-simplify" }
fsym-solvers = { path = "/workspace/scratch/be76fc747855/frankensympy/crates/fsym-solvers" }
fsym-durable = { path = "/workspace/scratch/be76fc747855/frankensympy/crates/fsym-durable", default-features = false }
fsym-runtime = { package = "fsym-runtime-session-source-component", path = "runtime" }
num-traits = "=0.2.19"
serde = { version = "=1.0.229", features = ["derive", "rc"] }
serde_json = { version = "=1.0.151", features = ["raw_value"] }
thiserror = "=2.0.20"

[lints.rust]
unsafe_code = "forbid"




































