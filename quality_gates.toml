# FrankenSymPy target quality-budget registry.
#
# Status: planning. These thresholds describe intended future gates; no
# `fsym-conformance` quality monitor or listed subsystem crates exist yet.
# A threshold becomes enforced only after its workstream supplies a live
# measurement tool, an immutable gate bundle, and a non-planning claim status.

schema_version = 1
registry_status = "planning"
enforced = false
enforcement_gate = "gate://future-quality-monitor"
claims_registry = "registries/claims.toml"
workstream_registry = "registries/workstreams.toml"

[coverage]
default_line_coverage_target = 80
default_branch_coverage_target = 60
measurement_status = "not_implemented"

[coverage.future_crate_targets]
fsym-runtime = { line = 85, branch = 70 }
fsym-core = { line = 85, branch = 70 }
fsym-polys = { line = 80, branch = 60 }
fsym-simplify = { line = 80, branch = 60 }
fsym-calculus = { line = 80, branch = 60 }
fsym-solvers = { line = 80, branch = 60 }
fsym-matrices = { line = 80, branch = 60 }
fsym-functions = { line = 80, branch = 60 }
fsym-logic = { line = 80, branch = 60 }
fsym-ntheory = { line = 85, branch = 70 }
fsym-sets = { line = 80, branch = 60 }
fsym-geometry = { line = 80, branch = 60 }
fsym-tensor = { line = 75, branch = 55 }
fsym-assumptions = { line = 80, branch = 60 }
fsym-printing = { line = 80, branch = 60 }
fsym-conformance = { line = 70, branch = 50 }

[flake]
max_flake_rate_target = 0.001
classification_rerun_count_target = 3
measurement_status = "not_implemented"

[runtime]
unit_suite_max_seconds_target = 120
e2e_suite_max_seconds_target = 600
benchmark_suite_max_seconds_target = 300
per_test_timeout_seconds_target = 30
measurement_status = "not_implemented"

[runtime.future_crate_targets]
fsym-conformance = { unit_max_seconds = 180, e2e_max_seconds = 600 }

[future_enforcement_policy]
coverage_violation = "warn"
flake_violation = "warn"
runtime_violation = "fail"
critical_coverage_floor = 50
critical_runtime_multiplier = 3.0

[activation_requirements]
monitor_implementation_exists = false
measurement_schema_frozen = false
representative_test_inventory_exists = false
same_commit_gate_bundle_required = true
claims_registry_update_required = true
